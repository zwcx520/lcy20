<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>走丢啦 - 高级唯美</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', '"Noto Serif SC"', 'serif'],
                        sans: ['"Inter"', '"PingFang SC"', 'sans-serif'],
                    },
                    colors: {
                        bloom: {
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                        }
                    },
                    animation: {
                        'fall': 'fall 12s linear infinite',
                        'bloom': 'bloom 8s ease-in-out infinite',
                        'float-slow': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fall: {
                            '0%': { opacity: '0', transform: 'translateY(-10vh) rotate(0deg)' },
                            '10%': { opacity: '1' },
                            '100%': { opacity: '0', transform: 'translateY(110vh) rotate(720deg)' },
                        },
                        bloom: {
                            '0%, 100%': { transform: 'scale(1)', opacity: '0.5' },
                            '50%': { transform: 'scale(1.15)', opacity: '0.75' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .text-outline {
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.5);
            color: transparent;
        }
        .petal {
            position: absolute;
            border-radius: 15px 0 15px 0;
            pointer-events: none;
        }
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
        }
    </style>
</head>
<body class="min-h-screen bg-[#faf5f7] overflow-hidden relative font-serif">
    
    <!-- 环境光斑层 -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="ambient-blob bg-pink-300 w-[500px] h-[500px] -top-20 -left-20 animate-bloom"></div>
        <div class="ambient-blob bg-purple-300 w-[400px] h-[400px] top-1/3 -right-10 animate-bloom" style="animation-delay: -3s;"></div>
        <div class="ambient-blob bg-blue-200 w-[600px] h-[600px] -bottom-32 left-1/4 animate-bloom" style="animation-delay: -6s;"></div>
        <div class="ambient-blob bg-rose-200 w-[300px] h-[300px] bottom-10 right-1/4 animate-bloom" style="animation-delay: -2s;"></div>
    </div>

    <!-- 花瓣层 -->
    <div id="petals" class="absolute inset-0 pointer-events-none"></div>

    <!-- 主内容 - 不对称网格 -->
    <div class="relative z-10 min-h-screen flex items-center">
        <div class="max-w-7xl mx-auto px-6 lg:px-12 w-full">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center min-h-[80vh]">
                
                <!-- 左侧：巨幅数字 + 浮动元素 -->
                <div class="lg:col-span-7 flex items-center justify-center lg:justify-start relative lg:pl-8">
                    <div class="relative">
                        <span class="text-[160px] sm:text-[220px] lg:text-[300px] font-bold leading-none text-outline block select-none tracking-tighter">404</span>
                        <span class="absolute -top-4 lg:-top-8 -right-4 lg:-right-12 text-5xl lg:text-7xl animate-pulse">🐰</span>
                        <span class="absolute bottom-2 lg:bottom-8 -left-8 lg:-left-16 text-3xl lg:text-5xl animate-float-slow">🌸</span>
                        <span class="absolute top-1/2 -right-2 lg:-right-20 text-2xl lg:text-4xl" style="animation: float 4s ease-in-out infinite;">💕</span>
                        <span class="absolute top-8 left-1/4 text-xl lg:text-3xl" style="animation: float 5s ease-in-out infinite 1s;">✨</span>
                    </div>
                </div>

                <!-- 右侧：信息卡片 -->
                <div class="lg:col-span-5 lg:pl-8">
                    <div class="glass rounded-[2rem] p-8 lg:p-12 relative overflow-hidden">
                        <!-- 装饰线 -->
                        <div class="w-12 h-px bg-white/70 mb-6"></div>
                        
                        <p class="text-white/60 text-[10px] sm:text-xs tracking-[0.3em] uppercase mb-3 font-sans">Page Not Found</p>
                        
                        <h1 class="text-3xl sm:text-4xl lg:text-5xl text-white font-light mb-4 leading-tight">
                            哎呀，<br>
                            <span class="font-semibold italic">走丢啦</span>
                        </h1>
                        
                        <p class="text-white/80 text-base sm:text-lg leading-relaxed mb-8 font-light">
                            这里是一片甜蜜的空白呢<br>
                            你寻找的页面好像躲起来了~
                        </p>
                        
                        <div class="flex items-center gap-3 sm:gap-4">
                            <a href="" class="group relative inline-flex items-center gap-2 px-6 sm:px-8 py-3 sm:py-4 bg-white text-pink-500 rounded-full text-sm sm:text-base font-medium transition-all duration-300 hover:shadow-xl hover:shadow-pink-200 hover:-translate-y-1">
                                带我回家
                                <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                </svg>
                            </a>
                            
                            <button class="w-11 h-11 sm:w-12 sm:h-12 rounded-full glass flex items-center justify-center text-white hover:bg-white/30 transition-all duration-300 shrink-0">
                                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- 装饰角 -->
                        <div class="absolute -bottom-8 -right-8 w-32 h-32 bg-gradient-to-tl from-white/15 to-transparent rounded-tl-[100px]"></div>
                    </div>
                </div>
            </div>
            
            <!-- 底部 -->
            <div class="absolute bottom-6 left-6 lg:bottom-8 lg:left-12 text-white/30 text-[10px] sm:text-xs tracking-widest font-sans">
                © 2024 · LOST IN BLOOM
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('petals');
        const colors = [
            'rgba(255, 183, 206, 0.8)',
            'rgba(255, 154, 158, 0.7)',
            'rgba(254, 207, 239, 0.8)',
            'rgba(255, 200, 221, 0.6)',
        ];
        for (let i = 0; i < 16; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal animate-fall';
            const size = Math.random() * 8 + 6;
            petal.style.cssText = `
                width: ${size}px; height: ${size}px;
                left: ${Math.random() * 100}vw;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                animation-delay: ${Math.random() * 15}s;
                animation-duration: ${Math.random() * 8 + 10}s;
            `;
            container.appendChild(petal);
        }
    </script>
</body>
</html>
