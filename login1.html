<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>归档登录/注册</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    
 
    <style>
        /*网络监测弹窗 自定义弹窗样式 */
   .custom-alert {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: yellow;
      color: red;
      padding: 20px;
      border: 1px solid #ccc;
      z-index: 1000;
      border-radius: 5%;
    }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Ma Shan Zheng', cursive;
        }
        
        :root {
            --anime-pink: #ff7675;
            --anime-purple: #a29bfe;
            --anime-blue: #74b9ff;
            --anime-yellow: #fdcb6e;
            --anime-dark: #2d3436;
            --anime-light: #f8f9fa;
            --anime-shadow: rgba(255, 118, 117, 0.3);
            --glow: 0 0 15px rgba(162, 155, 254, 0.6);
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* 动漫风背景粒子 */
        .anime-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
        
        /* 全屏容器 */
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* 全屏表单区域 */
        .form-section {
            width: 100%;
            max-width: 1200px;
            min-height: 85vh;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px var(--anime-shadow), var(--glow);
            overflow: hidden;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            border: 3px solid var(--anime-purple);
        }
        
        /* 动漫风标题栏 */
        .anime-header {
            background: linear-gradient(135deg, var(--anime-pink), var(--anime-purple));
            padding: 25px 0;
            text-align: center;
            position: relative;
            flex-shrink: 0;
        }
        
        .anime-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--anime-yellow), transparent);
        }
        
        .anime-header h1 {
            color: white;
            font-size: 2.8rem;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            letter-spacing: 3px;
        }
        
        .anime-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        
        /* 表单内容区域 */
        .form-content {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        
        /* 左侧信息区域 */
        .info-section {
            flex: 1;
            background: linear-gradient(135deg, rgba(162, 155, 254, 0.1), rgba(255, 118, 117, 0.1));
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 2px dashed var(--anime-purple);
        }
        
        .info-title {
            font-size: 2.2rem;
            color: var(--anime-purple);
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(162, 155, 254, 0.2);
        }
        
        .info-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--anime-dark);
            margin-bottom: 30px;
        }
        
        .features {
            margin-top: 30px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .feature i {
            font-size: 1.8rem;
            color: var(--anime-pink);
            margin-right: 15px;
            width: 40px;
            text-align: center;
        }
        
        .feature span {
            font-size: 1.1rem;
            color: var(--anime-dark);
        }
        
        /* 右侧表单区域 */
        .form-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
            overflow-y: auto;
        }
        
        /* 动漫风选项卡 */
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            position: relative;
            width: 100%;
        }
        
        .tabs::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--anime-pink), var(--anime-purple));
            transition: all 0.3s ease;
            border-radius: 3px 3px 0 0;
        }
        
        .tabs.login-active::after {
            width: 50%;
            left: 0;
        }
        
        .tabs.register-active::after {
            width: 50%;
            left: 50%;
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--anime-dark);
            transition: all 0.3s;
        }
        
        .tab.active {
            color: var(--anime-pink);
            text-shadow: 0 1px 2px rgba(255, 118, 117, 0.3);
        }
        
        .form {
            display: none;
            width: 100%;
        }
        
        .form.active {
            display: block;
            animation: animeFade 0.5s ease;
        }
        
        @keyframes animeFade {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        h2 {
            margin-bottom: 30px;
            color: var(--anime-purple);
            font-weight: 600;
            font-size: 2rem;
            text-align: center;
            text-shadow: 0 1px 3px rgba(162, 155, 254, 0.2);
        }
        
        /* 动漫风输入框 */
        .input-group {
            margin-bottom: 25px;
            position: relative;
            width: 100%;
        }
        
        .input-group input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #eee;
            background-color: white;
            border-radius: 15px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }
        
        .input-group input:focus {
            border-color: var(--anime-purple);
            box-shadow: 0 0 0 3px rgba(162, 155, 254, 0.2), var(--glow);
        }
        
        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--anime-pink);
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .input-group input:focus + i {
            color: var(--anime-purple);
            transform: translateY(-50%) scale(1.1);
        }
        
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
        }
        
        .remember {
            display: flex;
            align-items: center;
            color: var(--anime-dark);
        }
        
        .remember input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            accent-color: var(--anime-pink);
        }
        
        .forgot-password {
            color: var(--anime-purple);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .forgot-password:hover {
            color: var(--anime-pink);
            text-decoration: underline;
        }
        
        /* 动漫风按钮 */
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            background: linear-gradient(135deg, var(--anime-pink), var(--anime-purple));
            color: white;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px var(--anime-shadow);
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px var(--anime-shadow), var(--glow);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn i {
            margin-left: 10px;
            transition: transform 0.3s;
            font-size: 20px;
        }
        
        .btn:hover i {
            transform: translateX(8px) rotate(10deg);
        }
        
        .btn-loading {
            pointer-events: none;
            opacity: 0.8;
        }
        
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 动漫风社交登录 */
        .social-login {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }
        
        .social-login p {
            margin-bottom: 20px;
            color: var(--anime-dark);
            opacity: 0.8;
            position: relative;
            font-size: 15px;
            padding: 0 20px;
            font-weight: 500;
        }
        
        .social-login p::before, .social-login p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 25%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--anime-purple), transparent);
        }
        
        .social-login p::before {
            left: 0;
        }
        
        .social-login p::after {
            right: 0;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }
        
        .social-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: var(--anime-dark);
            font-size: 22px;
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid #eee;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
        }
        
        .social-icon:hover {
            transform: translateY(-5px) rotate(5deg);
            box-shadow: 0 10px 20px var(--anime-shadow);
            border-color: transparent;
        }
        
        .social-icon.facebook:hover {
            background: #3b5998;
            color: white;
            box-shadow: 0 0 20px rgba(59, 89, 152, 0.5);
        }
        
        .social-icon.google:hover {
            background: #dd4b39;
            color: white;
            box-shadow: 0 0 20px rgba(221, 75, 57, 0.5);
        }
        
        .social-icon.twitter:hover {
            background: #1da1f2;
            color: white;
            box-shadow: 0 0 20px rgba(29, 161, 242, 0.5);
        }
        
        /* 动漫风消息提示 */
        .message {
            padding: 15px 20px;
            margin-top: 20px;
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            border: 2px solid;
            width: 100%;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .success {
            background-color: rgba(116, 185, 255, 0.1);
            color: var(--anime-blue);
            border-color: var(--anime-blue);
            box-shadow: 0 5px 10px rgba(116, 185, 255, 0.2);
        }
        
        .error {
            background-color: rgba(255, 118, 117, 0.1);
            color: var(--anime-pink);
            border-color: var(--anime-pink);
            box-shadow: 0 5px 10px rgba(255, 118, 117, 0.2);
        }
        
        /* 底部信息 */
        .footer-info {
            text-align: center;
            margin-top: 30px;
            color: var(--anime-dark);
            font-size: 14px;
            opacity: 0.7;
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .form-content {
                flex-direction: column;
            }
            
            .info-section {
                border-right: none;
                border-bottom: 2px dashed var(--anime-purple);
            }
            
            .anime-header h1 {
                font-size: 2.2rem;
            }
            
            .info-title {
                font-size: 1.8rem;
            }
            
            .form-container, .info-section {
                padding: 30px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .form-section {
                min-height: 95vh;
                border-radius: 20px;
            }
            
            .anime-header {
                padding: 20px 0;
            }
            
            .anime-header h1 {
                font-size: 1.8rem;
            }
            
            .anime-header p {
                font-size: 1rem;
            }
            
            h2 {
                font-size: 1.6rem;
            }
            
            .form-container, .info-section {
                padding: 20px;
            }
            
            .info-title {
                font-size: 1.5rem;
            }
            
            .tab {
                padding: 12px 0;
                font-size: 1.1rem;
            }
            
            .input-group input {
                padding: 16px 18px;
                font-size: 15px;
            }
            
            .btn {
                padding: 16px;
                font-size: 16px;
            }
            
            .social-icon {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .anime-header h1 {
                font-size: 1.5rem;
            }
            
            .anime-header p {
                font-size: 0.9rem;
            }
            
            h2 {
                font-size: 1.4rem;
            }
            
            .tab {
                font-size: 1rem;
            }
            
            .input-group input {
                padding: 15px 16px;
            }
            
            .btn {
                padding: 15px;
            }
            
            .social-icons {
                gap: 15px;
            }
            
            .social-icon {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }
    </style>
</head>

<script>
  function showCustomAlert(message) {
    const alertDiv = document.createElement('div');
    alertDiv.className = 'custom-alert';
    alertDiv.textContent = message;
    document.body.appendChild(alertDiv);
    setTimeout(() => {
      document.body.removeChild(alertDiv);
    }, 3000); // 3秒后自动关闭弹窗
  }

  // 页面加载时先检查网络状态
  if (navigator.onLine === false) {
    showCustomAlert('网络已断开，请检查您的网络连接（可能没有 Wi-Fi 或移动数据等网络连接）');
  }

  // 监听网络断开事件
  window.addEventListener('offline', function () {
    showCustomAlert('网络已断开，请检查您的网络连接（可能没有 Wi-Fi 或移动数据等网络连接）');
  });

  // 监听网络连接事件
  window.addEventListener('online', function () {
    showCustomAlert('网络已连接成功！');
    location.reload(); // 添加这行代码，在网络连接成功时刷新页面
  });
</script>
    <script>
        // 生成动漫风背景粒子
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // 随机粒子大小、位置、动画延迟
                const size = Math.random() * 20 + 5;
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const delay = Math.random() * 5;
                const duration = Math.random() * 10 + 5;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.top = `${top}%`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                
                // 随机颜色
                const colors = [
                    'rgba(255, 118, 117, 0.3)', 
                    'rgba(162, 155, 254, 0.3)', 
                    'rgba(116, 185, 255, 0.3)', 
                    'rgba(253, 203, 110, 0.3)',
                    'rgba(255, 255, 255, 0.1)'
                ];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.backgroundColor = randomColor;
                
                // 随机形状
                if (Math.random() > 0.7) {
                    particle.style.borderRadius = '0';
                    particle.style.transform = 'rotate(45deg)';
                }
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // 初始化用户数据
        function initializeUsers() {
            if (!localStorage.getItem('users')) {
                const initialUsers = [
                    { username: 'lcy', password: 'lcy' },
                    { username: 'zwcx', password: 'zwcx' }
                ];
                localStorage.setItem('users', JSON.stringify(initialUsers));
            }
        }
        
        // 显示消息
        function showMessage(element, message, isSuccess) {
            element.textContent = message;
            element.className = 'message ' + (isSuccess ? 'success' : 'error');
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }
        
        // 设置按钮加载状态
        function setButtonLoading(button, isLoading) {
            if (isLoading) {
                button.classList.add('btn-loading');
                button.disabled = true;
            } else {
                button.classList.remove('btn-loading');
                button.disabled = false;
            }
        }
        
        // 切换表单显示
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const tabName = this.getAttribute('data-tab');
                const tabsContainer = document.getElementById('tabs');
                
                // 更新选项卡状态
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                // 更新选项卡下划线动画
                if (tabName === 'login') {
                    tabsContainer.className = 'tabs login-active';
                } else {
                    tabsContainer.className = 'tabs register-active';
                }
                
                // 显示对应的表单
                document.querySelectorAll('.form').forEach(form => form.classList.remove('active'));
                document.getElementById(tabName + 'Form').classList.add('active');
            });
        });
        
        // 处理登录表单提交
        document.getElementById('loginFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const messageElement = document.getElementById('loginMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            setButtonLoading(loginBtn, true);
            
            setTimeout(() => {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                const user = users.find(u => u.username === username && u.password === password);
                
                if (user) {
                    showMessage(messageElement, '归档通道已开启！正在传送...', true);
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    setTimeout(() => {
                        window.location.href = 'gd.html';
                    }, 2000);
                } else {
                    showMessage(messageElement, '归档ID或密钥错误！请重新尝试～', false);
                    setButtonLoading(loginBtn, false);
                }
            }, 1000);
        });
        
        // 处理注册表单提交
        document.getElementById('registerFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageElement = document.getElementById('registerMessage');
            const registerBtn = document.getElementById('registerBtn');
            
            if (password !== confirmPassword) {
                showMessage(messageElement, '两次密钥输入不一致！', false);
                return;
            }
            
            setButtonLoading(registerBtn, true);
            
            setTimeout(() => {
                const users = JSON.parse(localStorage.getItem('users')) || [];
                if (users.some(u => u.username === username)) {
                    showMessage(messageElement, '归档ID已被占用！换一个试试～', false);
                    setButtonLoading(registerBtn, false);
                    return;
                }
                
                users.push({ username, password });
                localStorage.setItem('users', JSON.stringify(users));
                showMessage(messageElement, '归档ID激活成功！准备登录～', true);
                document.getElementById('registerFormElement').reset();
                
                setTimeout(() => {
                    document.querySelector('.tab[data-tab="login"]').click();
                    setButtonLoading(registerBtn, false);
                }, 1500);
            }, 1000);
        });
        
        // 社交图标点击效果
        document.querySelectorAll('.social-icon').forEach(icon => {
            icon.addEventListener('click', function() {
                this.style.transform = 'scale(0.9) rotate(-5deg)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
                
                const message = this.classList.contains('facebook') ? 'Facebook归档通道即将开启！' :
                               this.classList.contains('google') ? 'Google归档通道即将开启！' :
                               'Twitter归档通道即将开启！';
                
                const messageElement = document.querySelector('.form.active .message');
                showMessage(messageElement, message, false);
            });
        });
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', function() {
            createParticles();
            initializeUsers();
            
            // 容器入场动画
            const container = document.querySelector('.container');
            const formSection = document.querySelector('.form-section');
            
            container.style.opacity = '0';
            formSection.style.transform = 'scale(0.9) translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'opacity 0.8s ease';
                container.style.opacity = '1';
                
                formSection.style.transition = 'transform 0.8s ease';
                formSection.style.transform = 'scale(1) translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
