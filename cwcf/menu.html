<script>
  // 动态分类展示
  document.addEventListener('DOMContentLoaded', () => {
    const categoryList = document.querySelector('ul.space-y-2');
    
    // 分类图标映射
    const categoryIcons = {
      all: 'fa-fire',
      classic: 'fa-fire',
      hotpot: 'fa-fire',
      snack: 'fa-fire',
      cold: 'fa-fire',
      home: 'fa-fire'
    };
    
    // 分类描述映射
    const categoryDescriptions = {
      all: '浏览所有川菜',
      classic: '麻婆豆腐、水煮肉片等',
      hotpot: '麻辣火锅、钵钵鸡等',
      snack: '担担面、龙抄手等',
      cold: '夫妻肺片、凉拌黄瓜等',
      home: '鱼香肉丝、宫保鸡丁等'
    };
    
    // 渲染分类列表
    function renderCategories() {
      categoryList.innerHTML = '';
      
      // 遍历分类
      Object.entries(recipeData.categories).forEach(([category, info]) => {
        // 跳过all分类，因为它是默认分类
        if (category === 'all') return;
        
        const li = document.createElement('li');
        li.innerHTML = `
          <a href="recipes.html?category=${category}" class="flex items-center p-3 rounded-lg hover:bg-red-50 transition-colors">
            <div class="text-primary mr-3">
              <i class="fa ${categoryIcons[category] || 'fa-fire'}"></i>
            </div>
            <div>
              <h5 class="font-medium">${info.title}</h5>
              <p class="text-xs text-gray-500">${categoryDescriptions[category] || ''}</p>
            </div>
            <i class="fa fa-chevron-right text-gray-400 ml-auto"></i>
          </a>
        `;
        categoryList.appendChild(li);
      });
    }
    
    renderCategories();
  });
</script>
