<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜谱分类 - 川味厨房</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="data.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#E63946',
            secondary: '#F4A261',
            dark: '#1D3557',
            light: '#F1FAEE',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .recipe-card-hover {
        @apply transition-all duration-300 hover:-translate-y-1 hover:shadow-xl;
      }
      .category-active {
        @apply bg-primary text-white;
      }
      .category-inactive {
        @apply bg-gray-100 text-dark hover:bg-red-50 hover:text-primary;
      }
    }
  </style>
</head>
<body class="bg-light text-dark antialiased">

<!-- 顶部导航 -->
<header class="sticky top-0 bg-white shadow-md z-30">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">
    <a href="index.html" class="text-xl text-dark">
      <i class="fa fa-arrow-left"></i>
    </a>
    <a href="index.html" class="text-2xl font-bold text-primary">川味厨房</a>
    <a href="search.html" class="text-xl text-dark">
      <i class="fa fa-search"></i>
    </a>
  </div>
</header>

<main class="container mx-auto px-4 py-6">
  <!-- 分类导航 -->
  <div class="bg-white rounded-xl shadow-md p-4 mb-6">
    <div class="flex overflow-x-auto scrollbar-hide gap-4 pb-2">
      <button data-category="all" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium category-active transition-colors">全部</button>
      <button data-category="classic" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium category-inactive transition-colors">经典川菜</button>
      <button data-category="hotpot" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium category-inactive transition-colors">火锅串串</button>
      <button data-category="snack" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium category-inactive transition-colors">小吃面点</button>
      <button data-category="cold" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium category-inactive transition-colors">凉菜系列</button>
      <button data-category="home" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium category-inactive transition-colors">家常小炒</button>
    </div>
  </div>

  <!-- 标题 -->
  <div class="mb-6">
    <h2 class="text-2xl font-bold mb-1" id="category-title">经典川菜教程</h2>
    <p class="text-gray-500 text-sm" id="category-desc">每一道都是川味灵魂，在家轻松做</p>
  </div>

  <!-- 菜谱列表 -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="recipes-container">
    <!-- 菜谱卡片将通过JavaScript动态生成 -->
  </div>
  
  <!-- 加载中状态 -->
  <div class="flex justify-center items-center py-12 hidden" id="loading">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
  </div>
  
  <!-- 空状态 -->
  <div class="text-center py-12 hidden" id="empty-state">
    <div class="text-gray-400 text-5xl mb-4">
      <i class="fa fa-cutlery"></i>
    </div>
    <h3 class="text-xl font-bold mb-2">暂无菜谱</h3>
    <p class="text-gray-500">该分类下暂无可菜谱，敬请期待</p>
  </div>
</main>

<footer class="mt-10 bg-dark text-white py-6">
  <div class="container mx-auto px-4 text-center">
    <p class="text-sm opacity-70">川味厨房 © 2026 专注正宗四川菜谱</p>
  </div>
</footer>

<script>
  // DOM 元素
  const categoryButtons = document.querySelectorAll('[data-category]');
  const recipesContainer = document.getElementById('recipes-container');
  const loadingElement = document.getElementById('loading');
  const emptyStateElement = document.getElementById('empty-state');
  const categoryTitleElement = document.getElementById('category-title');
  const categoryDescElement = document.getElementById('category-desc');
  
  // 初始化
  document.addEventListener('DOMContentLoaded', () => {
    renderRecipes('all');
    
    // 分类按钮点击事件
    categoryButtons.forEach(button => {
      button.addEventListener('click', () => {
        const category = button.dataset.category;
        
        // 更新分类按钮样式
        categoryButtons.forEach(btn => {
          btn.classList.remove('category-active', 'category-inactive');
          btn.classList.add(btn.dataset.category === category ? 'category-active' : 'category-inactive');
        });
        
        // 渲染对应分类的菜谱
        renderRecipes(category);
      });
    });
  });
  
  // 渲染菜谱
  function renderRecipes(category) {
    // 显示加载状态
    recipesContainer.classList.add('hidden');
    loadingElement.classList.remove('hidden');
    emptyStateElement.classList.add('hidden');
    
    // 更新分类标题和描述
    const categoryInfo = recipeData.getCategoryInfo(category);
    categoryTitleElement.textContent = categoryInfo.title;
    categoryDescElement.textContent = categoryInfo.desc;
    
    // 模拟加载延迟
    setTimeout(() => {
      const recipes = recipeData.getRecipesByCategory(category);
      
      // 清空容器
      recipesContainer.innerHTML = '';
      
      // 隐藏加载状态
      loadingElement.classList.add('hidden');
      
      // 检查是否有菜谱
      if (recipes.length === 0) {
        emptyStateElement.classList.remove('hidden');
        recipesContainer.classList.add('hidden');
        return;
      }
      
      // 渲染菜谱卡片
      recipes.forEach(recipe => {
        const recipeCard = document.createElement('div');
        recipeCard.className = 'bg-white rounded-xl shadow-md overflow-hidden recipe-card-hover';
        recipeCard.innerHTML = `
          <img src="${recipe.image}" alt="${recipe.name}" class="w-full h-44 object-cover">
          <div class="p-4">
            <h3 class="text-lg font-bold">${recipe.name}</h3>
            <p class="text-sm text-gray-500 mb-2">${recipe.desc}</p>
            <div class="flex justify-between items-center">
              <span class="text-xs text-gray-400 flex items-center">
                <i class="fa fa-clock-o mr-1"></i> ${recipe.time}
              </span>
              <a href="recipe-detail.html?id=${recipe.id}" class="text-primary text-sm font-medium">查看教程 →</a>
            </div>
          </div>
        `;
        recipesContainer.appendChild(recipeCard);
      });
      
      // 显示菜谱容器
      recipesContainer.classList.remove('hidden');
    }, 500); // 模拟500ms加载时间
  }
</script>

</body>
</html>
