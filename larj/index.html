<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>我们的恋爱日记 | 情侣专属空间</title>

  <!-- 国内CDN -->
  <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts 浪漫可爱字体 -->
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/layer/3.5.1/layer.js"></script>

</head>

<body>

  <!-- APP 整体容器 -->
  <div class="app-wrapper">

    <!-- 顶部实时状态栏 -->
    <div class="app-status">
      <span id="realTime">9:41</span>
      <span>
        <i class="fa-solid fa-signal"></i>
        <span id="batteryText">99%</span>
        <i id="batteryIcon" class="fa-solid fa-battery-full"></i>
      </span>
    </div>

    <!-- 顶部标题 -->
    <div class="app-header">
      我们的恋爱日记
    </div>

    <!-- 内容区域 -->
    <div class="app-content">

      <!-- 页面1：首页 -->
      <div class="page active" id="page-home">
        <!-- 情侣信息 -->
        <div class="card-box lover-card">
          <div class="lover-background">
            <div class="lover-avatars">
              <div class="avatar-container">
                <img src="https://picsum.photos/seed/boy/120/120.jpg" alt="男生" class="lover-avatar boy-avatar">
                <div class="avatar-ring"></div>
              </div>
              <div class="heart-connect">
                <i class="fa-solid fa-heart"></i>
              </div>
              <div class="avatar-container">
                <img src="https://picsum.photos/seed/girl/120/120.jpg" alt="女生" class="lover-avatar girl-avatar">
                <div class="avatar-ring"></div>
              </div>
            </div>
            <div class="lover-info text-center mt-4">
              <h5 id="couple-names" class="mb-2">-- & --</h5>
              <p class="lover-days mb-0">
                <i class="fa-solid fa-clock me-2"></i>
                相恋第 <span id="lover-days-num">--</span> 天
              </p>
            </div>
          </div>
        </div>

        <!-- 今日心情 -->
        <div class="card-box">
          <h6 class="mb-2">😊 今日心情</h2>
          <p class="mb-0" id="todayWord">山野千里，你是微风中的欢喜。</p>
        </div>

        <!-- 倒计时 -->
        <div class="card-box">
          <h6 class="mb-3">⏰ 重要事件</h3>
          <div class="row">
            <div class="col-4 count-item">
              <div class="num">214</div>
              <div class="small">相恋天数</div>
            </div>
            <div class="col-4 count-item">
              <div class="num">2026.3.18</div>
              <div class="small">相遇时间</div>
            </div>
            
          </div>
        </div>

        <!-- 纪念日管理 -->
        <div class="card-box">
          <h6 class="mb-3">🎯 纪念日管理</h3>
          
          <!-- 男生女生分区 -->
          <div class="row">
            <!-- 男生分区 -->
            <div class="col-6 mb-3">
              <div class="birthday-card boy-card p-3 rounded-lg">
                <div class="text-center mb-2">
                  <i class="fa-solid fa-mars text-blue"></i>
                  <h6 class="mt-1" id="boy-name">--</h6>
                </div>
                <div class="birthday-info">
                  <div class="d-flex justify-content-between mb-2">
                    <span>生日</span>
                    <span id="boy-birthday" class="text-blue">--</span>
                  </div>
                  <div class="d-flex justify-content-between">
                    <span>距离生日</span>
                    <span id="boy-birthday-countdown" class="text-danger">-- 天</span>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- 女生分区 -->
            <div class="col-6 mb-3">
              <div class="birthday-card girl-card p-3 rounded-lg">
                <div class="text-center mb-2">
                  <i class="fa-solid fa-venus text-pink"></i>
                  <h6 class="mt-1" id="girl-name">--</h6>
                </div>
                <div class="birthday-info">
                  <div class="d-flex justify-content-between mb-2">
                    <span>生日</span>
                    <span id="girl-birthday" class="text-pink">--</span>
                  </div>
                  <div class="d-flex justify-content-between">
                    <span>距离生日</span>
                    <span id="girl-birthday-countdown" class="text-danger">-- 天</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <!-- 共同纪念日 -->
          <div class="common-anniversary mt-3">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
              <div>相恋纪念日</div>
              <div id="love-days" class="text-danger">-- 天</div>
            </div>
            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
              <div><i class="fa-solid fa-mars text-blue me-1"></i> 陪 <span id="boy-name-in-total">--</span> 过的生日</div>
              <div id="boy-birthdays-total" class="text-danger">-- 个</div>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <div><i class="fa-solid fa-venus text-pink me-1"></i> 陪 <span id="girl-name-in-total">--</span> 过的生日</div>
              <div id="girl-birthdays-total" class="text-danger">-- 个</div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部TAB导航 -->
    <div class="app-tabbar">
      <a href="index.html" class="tab-item active">
        <i class="fa-solid fa-home"></i>
        首页
      </a>
      <a href="diary.html" class="tab-item">
        <i class="fa-solid fa-book"></i>
        日记
      </a>
      <a href="photo.html" class="tab-item">
        <i class="fa-solid fa-camera"></i>
        相册
      </a>
      <a href="my.html" class="tab-item">
        <i class="fa-solid fa-user"></i>
        关于
      </a>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
