<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人音乐空间 - 我的音乐作品集</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <header class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <h1>个人音乐空间</h1>
            </div>
            <nav class="nav-links">
               
            </nav>
            <div class="search-box">
                <input type="text" placeholder="搜索音乐、歌手">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="user-profile">
                <img src="https://picsum.photos/100/100" alt="用户头像" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>个人简介</h3>
                <div class="profile-info" style="padding: 1rem; text-align: center;">
                    <img src="https://picsum.photos/200/200" alt="个人头像" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 1rem; display: block;">
                    <p style="margin-bottom: 0.5rem; font-weight: 600;">不见桃花不见秋</p>
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">分享我的音乐作品和收藏</p>
                </div>
            </div>
          
            <div class="sidebar-section">
                <h3>最近播放</h3>
                <ul id="recent-plays">
                    <li>暂无播放记录</li>
                </ul>
            </div>
        </aside>

        <!-- 音乐列表区域 -->
        <section class="music-list-section">
            <div class="section-header">
                <h2>我的音乐作品集</h2>
                <div class="sort-options">
                    <button>按名称排序</button>
                    <button>按创作时间排序</button>
                </div>
            </div>
            <div class="music-list" id="music-list">
                <!-- 音乐项将通过JavaScript动态添加 -->
            </div>
        </section>
    </main>

    <!-- 播放控制栏 -->
    <footer class="player-footer">
        <div class="player-container">
            <div class="current-track">
                <div class="track-info">
                    <div class="track-cover" id="current-cover">
                        <img src="" alt="封面" />
                    </div>
                    <div class="track-details">
                        <h4 id="current-title">未播放</h4>
                        <p id="current-artist">未知艺术家</p>
                    </div>
                </div>
            </div>
            
            <div class="player-controls">
                <div class="control-buttons">
                    <button id="prev-btn"><i class="fas fa-step-backward"></i></button>
                    <button id="play-btn"><i class="fas fa-play"></i></button>
                    <button id="next-btn"><i class="fas fa-step-forward"></i></button>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="volume-control">
                <i class="fas fa-volume-up"></i>
                <div class="volume-bar">
                    <div class="volume-level" id="volume-level"></div>
                </div>
                <i class="fas fa-random"></i>
                <i class="fas fa-redo"></i>
                <i class="fas fa-list"></i>
            </div>
        </div>
    </footer>

    <!-- 音乐播放器元素 -->
    <audio id="audio-player" preload="metadata">
        您的浏览器不支持音频元素。
    </audio>

    <script src="script.js"></script>
</body>
</html>
