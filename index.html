<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归档-时光卷轴</title>
    <link rel="shortcut icon" href="app.jpg" type="image/x-icon">
          
    
    
     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f9c5d1, #c2a6e3, #a1c4fd);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 0;
            position: relative;
            overflow: hidden;
        }
        
        /* 背景装饰元素 */
        .bg-heart {
            position: absolute;
            font-size: 120px;
            color: rgba(255, 255, 255, 0.15);
            z-index: 0;
            animation: float 15s infinite linear;
        }
        
        .bg-heart:nth-child(1) {
            top: 5%;
            left: 5%;
        }
        
        .bg-heart:nth-child(2) {
            top: 15%;
            right: 8%;
            animation-duration: 18s;
        }
        
        .bg-heart:nth-child(3) {
            bottom: 10%;
            left: 12%;
            animation-duration: 22s;
        }
        
        .bg-heart:nth-child(4) {
            bottom: 20%;
            right: 6%;
            animation-duration: 16s;
        }
        
        .bg-heart:nth-child(5) {
            top: 50%;
            left: 8%;
            animation-duration: 20s;
        }
        
        .bg-heart:nth-child(6) {
            top: 60%;
            right: 12%;
            animation-duration: 14s;
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        
        .container {
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
            display: grid;
            grid-template-rows: 1fr 1fr;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><path fill="%23ffb6c1" opacity="0.1" d="M50,30 A20,20 0 1,1 50,70 A20,20 0 1,1 50,30 Z"/></svg>');
            opacity: 0.2;
            z-index: 0;
        }
        
        .form-side {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            z-index: 1;
        }
        
        .welcome-side {
            background: linear-gradient(45deg, rgba(255, 154, 158, 0.7), rgba(250, 208, 196, 0.7));
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .welcome-side::before {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: -80px;
            right: -80px;
        }
        
        .welcome-side::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
        }
        
        .heart {
            font-size: 80px;
            color: #ff4d6d;
            margin-bottom: 20px;
            animation: heartbeat 1.5s infinite;
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.5);
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #ff4d6d;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        
        h2 {
            font-size: 26px;
            margin-bottom: 30px;
            color: #6a5acd;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        
        .welcome-side h2 {
            color: white;
            font-size: 32px;
        }
        
        .welcome-side p {
            font-size: 18px;
            max-width: 80%;
            line-height: 1.6;
        }
        
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff4d6d;
            z-index: 1;
            font-size: 18px;
        }
        
        input {
            width: 100%;
            padding: 18px 20px 18px 55px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            color: #333;
        }
        
        input::placeholder {
            color: rgba(0, 0, 0, 0.6);
        }
        
        input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.5);
            background: rgba(255, 255, 255, 0.5);
        }
        
        button {
            background: linear-gradient(to right, rgba(255, 77, 109, 0.8), rgba(255, 143, 163, 0.8));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            font-weight: bold;
            margin-top: 10px;
            backdrop-filter: blur(5px);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 77, 109, 0.4);
            background: linear-gradient(to right, rgba(255, 77, 109, 0.9), rgba(255, 143, 163, 0.9));
        }
        
        .toggle-form {
            text-align: center;
            margin-top: 25px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .toggle-form a {
            color: #ff4d6d;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }
        
        .toggle-form a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            backdrop-filter: blur(5px);
        }
        
        .success {
            background-color: rgba(212, 237, 218, 0.8);
            color: #155724;
        }
        
        .error {
            background-color: rgba(248, 215, 218, 0.8);
            color: #721c24;
        }
        
        .hidden {
            display: none;
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .container {
                grid-template-rows: 1fr 1fr;
            }
            
            .welcome-side, .form-side {
                padding: 30px;
            }
            
            .heart {
                font-size: 60px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            h2 {
                font-size: 22px;
            }
            
            .welcome-side h2 {
                font-size: 26px;
            }
        }
        
        @media (max-width: 600px) {
            .welcome-side, .form-side {
                padding: 25px;
            }
            
            .heart {
                font-size: 50px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            h2 {
                font-size: 20px;
            }
            
            .welcome-side h2 {
                font-size: 22px;
            }
            
            .welcome-side p {
                font-size: 16px;
            }
            
            input {
                padding: 15px 15px 15px 45px;
            }
            
            button {
                padding: 15px;
            }
            
            .bg-heart {
                font-size: 80px;
            }
        }
        
        @media (max-width: 400px) {
            .welcome-side, .form-side {
                padding: 20px;
            }
            
            .heart {
                font-size: 40px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            h2 {
                font-size: 18px;
            }
            
            .welcome-side h2 {
                font-size: 20px;
            }
            
            .welcome-side p {
                font-size: 14px;
            }
            
            .bg-heart {
                font-size: 60px;
            }
        }
        
        /* 小屏幕竖屏优化 */
        @media (max-width: 900px) and (orientation: portrait) {
            .container {
                grid-template-rows: 1.2fr 0.8fr;
            }
        }
	 </style>

	
</head>

 
     
				  <body>
    <!-- 背景装饰 -->
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    
    <div class="container">
        <div class="form-side">
            <!-- 登录表单 -->
            <div id="login-form">
                <h1>欢迎回来</h1>
                <h2>请登录您的账户</h2>
                
                <div id="login-message" class="message"></div>
                
                <div class="input-group">
                    <i>👤</i>
                    <input type="text" id="login-username" placeholder="用户名" required>
                </div>
                
                <div class="input-group">
                    <i>🔒</i>
                    <input type="password" id="login-password" placeholder="密码" required>
                </div>
                
                <button id="login-btn">登录</button>
                
                <div class="toggle-form">
                    还没有账户？ <a id="show-register">立即注册</a>
                </div>
            </div>
            
            <!-- 注册表单 -->
            <div id="register-form" class="hidden">
                <h1>创建账户</h1>
                <h2>开启浪漫之旅</h2>
                
                <div id="register-message" class="message"></div>
                
                <div class="input-group">
                    <i>👤</i>
                    <input type="text" id="register-username" placeholder="用户名" required>
                </div>
                
                <div class="input-group">
                    <i>🔒</i>
                    <input type="password" id="register-password" placeholder="密码" required>
                </div>
                
                <div class="input-group">
                    <i>🔒</i>
                    <input type="password" id="confirm-password" placeholder="确认密码" required>
                </div>
                
                <button id="register-btn">注册</button>
                
                <div class="toggle-form">
                    已有账户？ <a id="show-login">立即登录</a>
                </div>
            </div>
        </div>
        
        <div class="welcome-side">
            <div class="heart">❤️</div>
            <h1>浪漫之约</h1>
            <h2>开启您的浪漫之旅</h2>
            <p>记录美好时刻，分享甜蜜时光。在这里，每一刻都值得珍藏。</p>
        </div>
	</div>
    <script>
        // 初始化用户数据
        function initUsers() {
            // 检查本地存储中是否已有用户数据
            if (!localStorage.getItem('users')) {
                // 创建初始用户
                const initialUsers = {
                    'lcy': 'lcy',
                    'zwcx': 'zwcx'
                };
                
                // 存储到本地
                localStorage.setItem('users', JSON.stringify(initialUsers));
            }
        }
        
        // 显示消息
        function showMessage(element, message, isError = false) {
            element.textContent = message;
            element.className = isError ? 'message error' : 'message success';
            element.style.display = 'block';
            
            // 3秒后隐藏消息
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }
        
        // 切换表单显示
        document.getElementById('show-register').addEventListener('click', function() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        });
        
        document.getElementById('show-login').addEventListener('click', function() {
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        });
        
        // 注册功能
        document.getElementById('register-btn').addEventListener('click', function() {
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const messageElement = document.getElementById('register-message');
            
            // 验证输入
            if (!username || !password || !confirmPassword) {
                showMessage(messageElement, '请填写所有字段', true);
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage(messageElement, '两次输入的密码不一致', true);
                return;
            }
            
            if (password.length < 6) {
                showMessage(messageElement, '密码长度至少为6位', true);
                return;
            }
            
            // 获取现有用户数据
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            
            // 检查用户名是否已存在
            if (users[username]) {
                showMessage(messageElement, '用户名已存在', true);
                return;
            }
            
            // 添加新用户
            users[username] = password;
            localStorage.setItem('users', JSON.stringify(users));
            
            showMessage(messageElement, '注册成功！请登录');
            
            // 清空表单
            document.getElementById('register-username').value = '';
            document.getElementById('register-password').value = '';
            document.getElementById('confirm-password').value = '';
            
            // 切换到登录表单
            setTimeout(() => {
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
            }, 1500);
        });
        
        // 登录功能
        document.getElementById('login-btn').addEventListener('click', function() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const messageElement = document.getElementById('login-message');
            
            // 验证输入
            if (!username || !password) {
                showMessage(messageElement, '请填写用户名和密码', true);
                return;
            }
            
            // 获取用户数据
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            
            // 验证用户名和密码
            if (users[username] && users[username] === password) {
                showMessage(messageElement, '登录成功！正在登陆...');
                
                // 保存当前登录用户
                localStorage.setItem('currentUser', username);
                
                // 跳转到百度
                setTimeout(() => {
                    window.location.href = 'gd.html';
                }, 1500);
            } else {
                showMessage(messageElement, '用户名或密码错误', true);
            }
        });
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initUsers();
        });
	</script>
       
</body>
</html>
