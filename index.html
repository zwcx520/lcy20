    <style>
    .appico{
      position:absolute;

      left:15px;

      }
    footer{
      position:absolute;

  <style>
        /* 导航按钮*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .sidebar-toggle {
            position: fixed;
            top:45px;
            right: 20px;
            transform: translateY(-50%);
            width: 5px;
            height: 5px;
            background: #e4c6d0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .sidebar-toggle:hover {
            background: #ffe2e2;
            transform: translateY(-50%) scale(1.1);
        }
        
        .sidebar-toggle span {
            display: block;
            width: 20px;
            height: 1px;
            background: white;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .sidebar-toggle span::before,
        .sidebar-toggle span::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            transition: all 0.3s ease;
        }
        
        .sidebar-toggle span::before {
            top: -8px;
        }
        
        .sidebar-toggle span::after {
            top: 8px;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            border-radius:20px 0px 0px 20px;
            right: -300px;
            width: 300px;
            height: 100%;
            background: #edd1d8;
            color: white;
            z-index: 999;
            transition: right 0.4s ease;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar.active {
            right: 0;
        }
        
        .sidebar-header {
            padding: 25px;
            border-radius:20px 0px 0px 0px;
            background: #e5deb9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-header h2 {
            font-size: 1.5rem;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .close-btn:hover {
            transform: rotate(90deg);
        }
        
        .sidebar-menu {
            padding: 20px 0;
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .sidebar-menu ul {
            list-style: none;
        }
        
        .sidebar-menu li {
            padding: 15px 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-left: 3px solid transparent;
        }
        
        .sidebar-menu li:hover {
            background: #34495e;
            border-left: 3px solid #3498db;
        }
        
        .sidebar-menu li i {
            margin-right: 15px;
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }
        
        .sidebar-footer {
            padding: 20px;
            text-align: center;
            background: #e5deb9;
            font-size: 0.9rem;
            color: #95a5a6;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
            
            .sidebar-toggle {
                right: 10px;
                width: 50px;
                height: 50px;
            }
        }
  </style>
	
</head>

 
     
				  <body>
    <!-- 背景装饰 -->
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    <div class="bg-heart">❤️</div>
    
    <div class="container">
        <div class="form-side">
            <!-- 登录表单 -->
            <div id="login-form">
                <h1>欢迎回来</h1>
                <h2>请登录您的账户</h2>
                
                <div id="login-message" class="message"></div>
                
                <div class="input-group">
                    <i>👤</i>
                    <input type="text" id="login-username" placeholder="用户名" required>
                </div>
                
                <div class="input-group">
                    <i>🔒</i>
                    <input type="password" id="login-password" placeholder="密码" required>
                </div>
                
                <button id="login-btn">登录</button>
                
                <div class="toggle-form">
                    还没有账户？ <a id="show-register">立即注册</a>
                </div>
            </div>
            
            <!-- 注册表单 -->
            <div id="register-form" class="hidden">
                <h1>创建账户</h1>
                <h2>开启浪漫之旅</h2>
                
                <div id="register-message" class="message"></div>
                
                <div class="input-group">
                    <i>👤</i>
                    <input type="text" id="register-username" placeholder="用户名" required>
                </div>
                
                <div class="input-group">
                    <i>🔒</i>
                    <input type="password" id="register-password" placeholder="密码" required>
                </div>
                
                <div class="input-group">
                    <i>🔒</i>
                    <input type="password" id="confirm-password" placeholder="确认密码" required>
                </div>
                
                <button id="register-btn">注册</button>
                
                <div class="toggle-form">
                    已有账户？ <a id="show-login">立即登录</a>
                </div>
            </div>
        </div>
        
        <div class="welcome-side">
            <div class="heart">❤️</div>
            <h1>浪漫之约</h1>
            <h2>开启您的浪漫之旅</h2>
            <p>记录美好时刻，分享甜蜜时光。在这里，每一刻都值得珍藏。</p>
        </div>
	</div>
