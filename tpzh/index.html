<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片转ICO工具 · Anime Style</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }

    body {
      background: #fdfaff;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(180, 140, 255, 0.15);
      padding: 36px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      border: 1px solid #f0e6ff;
    }

    h1 {
      font-size: 24px;
      color: #7f56da;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
    }

    .drop-area {
      border: 2px dashed #d4bdff;
      border-radius: 16px;
      padding: 40px 20px;
      cursor: pointer;
      transition: all 0.3s;
      background: #faf6ff;
      margin-bottom: 24px;
    }

    .drop-area:hover {
      border-color: #7f56da;
      background: #f6f0ff;
    }

    .drop-area input {
      display: none;
    }

    .preview {
      max-width: 160px;
      max-height: 160px;
      margin: 16px auto;
      display: none;
      border-radius: 8px;
      object-fit: contain;
    }

    .size-select {
      margin: 20px 0;
    }

    .size-select label {
      margin-right: 10px;
      color: #555;
    }

    select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .btn {
      background: #7f56da;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin: 8px;
    }

    .btn:hover {
      background: #6a42c2;
    }

    .btn:disabled {
      background: #c3b0e7;
      cursor: not-allowed;
    }

    .filename {
      color: #777;
      margin-top: 10px;
      font-size: 14px;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌸 图片转ICO工具</h1>
    <p class="subtitle">支持 JPG、PNG、GIF、WebP 一键转图标</p>

    <div class="drop-area" id="dropArea">
      <p>点击或拖拽图片到此处</p>
      <input type="file" id="fileInput" accept="image/*">
      <img id="preview" class="preview">
      <div id="fileName"></div>
    </div>

    <div class="size-select">
      <label>ICO 尺寸：</label>
      <select id="size">
        <option value="16">16×16</option>
        <option value="32">32×32</option>
        <option value="48">48×48</option>
        <option value="64">64×64</option>
        <option value="128">128×128</option>
        <option value="256" selected>256×256</option>
      </select>
    </div>

    <button class="btn" id="convertBtn" disabled>生成 ICO</button>
    <button class="btn" id="downloadBtn" disabled>下载 ICO</button>

    <div class="footer">Anime Style · ICO Converter</div>
  </div>

  <script>
    const dropArea = document.getElementById('dropArea')
    const fileInput = document.getElementById('fileInput')
    const preview = document.getElementById('preview')
    const fileName = document.getElementById('fileName')
    const convertBtn = document.getElementById('convertBtn')
    const downloadBtn = document.getElementById('downloadBtn')
    const sizeSelect = document.getElementById('size')

    let currentFile = null
    let icoBlob = null

    // 点击选择
    dropArea.addEventListener('click', () => fileInput.click())

    // 拖拽
    dropArea.addEventListener('dragover', (e) => {
      e.preventDefault()
      dropArea.style.borderColor = '#7f56da'
    })

    dropArea.addEventListener('dragleave', () => {
      dropArea.style.borderColor = '#d4bdff'
    })

    dropArea.addEventListener('drop', (e) => {
      e.preventDefault()
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files
        handleFile(e.dataTransfer.files[0])
      }
    })

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0])
    })

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('请选择图片文件')
        return
      }
      currentFile = file
      preview.src = URL.createObjectURL(file)
      preview.style.display = 'block'
      fileName.textContent = file.name
      convertBtn.disabled = false
      downloadBtn.disabled = true
    }

    // 转换为 ICO
    convertBtn.addEventListener('click', async () => {
      if (!currentFile) return
      const size = parseInt(sizeSelect.value)
      convertBtn.disabled = true
      convertBtn.textContent = '生成中…'

      try {
        icoBlob = await convertToIco(currentFile, size)
        downloadBtn.disabled = false
        convertBtn.textContent = '生成成功'
      } catch (e) {
        alert('转换失败：' + e.message)
        convertBtn.textContent = '生成 ICO'
        convertBtn.disabled = false
      }
    })

    // 下载
    downloadBtn.addEventListener('click', () => {
      if (!icoBlob) return
      const a = document.createElement('a')
      a.href = URL.createObjectURL(icoBlob)
      a.download = 'icon.ico'
      a.click()
    })

    // 核心：图片转ICO（简易实现）
    async function convertToIco(imageFile, size) {
      const canvas = document.createElement('canvas')
      const ctx = canvas.getContext('2d')
      canvas.width = size
      canvas.height = size

      const img = new Image()
      await new Promise((resolve, reject) => {
        img.onload = resolve
        img.onerror = reject
        img.src = URL.createObjectURL(imageFile)
      })

      ctx.drawImage(img, 0, 0, size, size)

      return new Promise((resolve) => {
        canvas.toBlob((blob) => {
          resolve(new Blob([blob], { type: 'image/x-icon' }))
        }, 'image/x-icon')
      })
    }
  </script>
</body>
</html>
