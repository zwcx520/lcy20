<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>时光归档 · Time Archive</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --bg: #0f1217;
  --card: #1a1e27;
  --card-hover: #222733;
  --text: #e8e9ed;
  --text-secondary: #9ca3b3;
  --accent: #6366f1;
  --accent-light: #818cf8;
  --border: #2d3240;
  --radius: 16px;
  --shadow: 0 8px 24px rgba(0,0,0,0.25);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px 12px 60px;
  line-height: 1.5;
}
/* 顶部导航栏 */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(26,30,39,0.8);
  backdrop-filter: blur(12px);
  border-radius: var(--radius);
  margin-bottom: 20px;
  position: sticky;
  top: 12px;
  z-index: 99;
  box-shadow: var(--shadow);
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
}
/* 搜索框样式 */
.search-container {
  position: relative;
  width: 60%;
}
.search-input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: 0.2s;
}
.search-input:focus {
  border-color: var(--accent);
  background: var(--card-hover);
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
}
/* 年份分组 */
.year-group {
  margin-bottom: 28px;
}
.year-title {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  padding: 0 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.year-title::before {
  content: "";
  width: 4px;
  height: 14px;
  background: var(--accent);
  border-radius: 2px;
}
/* 卡片列表 */
.card-list {
  display: grid;
  gap: 12px;
}
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  border: 1px solid var(--border);
  transition: 0.2s;
  cursor: pointer;
}
.card:hover {
  background: var(--card-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.card .date {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.card .title {
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 6px;
}
.card .desc {
  font-size: 14px;
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* 搜索结果为空提示 */
.no-results {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}
/* 高亮搜索关键词 */
.highlight {
  background: rgba(99, 102, 241, 0.2);
  color: var(--accent-light);
  padding: 2px 4px;
  border-radius: 4px;
}
/* 底部安全区 */
.footer {
  text-align: center;
  margin-top: 40px;
  font-size: 12px;
  color: var(--text-secondary);
}
/* 适配PC */
@media (min-width: 768px) {
  body {
    max-width: 700px;
    margin: 0 auto;
  }
  .search-container {
    width: 40%;
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>4月归档</h1>
  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索记录..." oninput="searchRecords()">
  </div>
</div>

<div id="archiveContainer"></div>

<div class="footer"><span class="年份检测" id="yearSpan"></span>  · 记录每一段旅程</div>
<script>
// 获取当前年份并插入标签
document.getElementById("yearSpan").innerText = new Date().getFullYear();
</script>
<script>
// 1. 数据层：将所有归档记录存储在数组中，便于遍历和管理
const archiveData = [
  {
    date: "2026-04-02",
    title: "第二天",
    desc: ""
  },
  {
    date: "2026-04-01",
    title: "又是一个月",
    desc: ""
  }
  // 可以在这里继续添加更多记录...
];

// 2. 渲染函数：根据数据生成HTML
function renderArchive(records) {
  const container = document.getElementById('archiveContainer');
  
  if (!records || records.length === 0) {
    container.innerHTML = '<div class="no-results">未找到匹配的记录</div>';
    return;
  }

  // 按年份和月份分组数据
  const grouped = {};
  records.forEach(record => {
    const yearMonth = record.date.slice(0, 7); // 获取 YYYY-MM
    if (!grouped[yearMonth]) grouped[yearMonth] = [];
    grouped[yearMonth].push(record);
  });

  let html = '';
  // 遍历分组数据，生成HTML结构
  Object.keys(grouped).sort().reverse().forEach(ym => {
    const [year, month] = ym.split('-');
    html += `
      <div class="year-group">
        <div class="year-title">${year} 年${month}月</div>
        <div class="card-list">
    `;
    grouped[ym].forEach(record => {
      html += `
        <div class="card">
          <div class="date">${record.date}</div>
          <div class="title">${record.title}</div>
          <div class="desc">${record.desc}</div>
        </div>
      `;
    });
    html += `
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// 3. 搜索功能：遍历数据数组，进行模糊匹配
function searchRecords() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  
  // 如果搜索词为空，渲染全部数据
  if (!searchTerm) {
    renderArchive(archiveData);
    return;
  }

  // 核心：遍历数据数组，筛选匹配项
  const filteredRecords = archiveData.filter(record => {
    const title = record.title.toLowerCase();
    const desc = record.desc.toLowerCase();
    const date = record.date.toLowerCase();
    // 只要标题、描述、日期中任意一项包含关键词，就匹配成功
    return title.includes(searchTerm) || desc.includes(searchTerm) || date.includes(searchTerm);
  });

  // 渲染搜索结果
  renderArchive(filteredRecords);
  
  // 对搜索结果中的关键词进行高亮
  highlightKeywords(searchTerm);
}

// 4. 高亮关键词函数
function highlightKeywords(keyword) {
  if (!keyword) return;
  const elements = document.querySelectorAll('.title, .desc, .date');
  const regex = new RegExp(`(${keyword})`, 'gi');
  elements.forEach(el => {
    el.innerHTML = el.textContent.replace(regex, '<span class="highlight">$1</span>');
  });
}

// 5. 初始化：页面加载时渲染所有记录
document.addEventListener('DOMContentLoaded', () => {
  renderArchive(archiveData);
});

// 6. 点击卡片事件
document.addEventListener('click', function(e) {
  if (e.target.closest('.card')) {
    alert('打开记录详情页（可替换为路由/弹窗）');
  }
});
</script>
</body>
</html>
